<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare AI Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        
        /* Sidebar Styles */
        #sidebar { width: 260px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 15px; gap: 10px; }
        #new-chat-btn { background: #0284c7; border: none; color: white; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: left; transition: background 0.2s; }
        #new-chat-btn:hover { background: #0ea5e9; }
        #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .history-item { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.2s; }
        .history-item:hover { background: #334155; }
        .history-item.active { background: #334155; color: #38bdf8; font-weight: 500; }

        /* Main Chat Area */
        #main-area { flex: 1; display: flex; flex-direction: column; height: 100vh; background: #0f172a; }
        header { padding: 15px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        h2 { margin: 0; font-size: 1.1rem; color: #38bdf8; }
        
        /* Model Selector Dropdown */
        select { background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; cursor: pointer; }
        select:focus { border-color: #38bdf8; }

        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 75%; line-height: 1.5; font-size: 0.95rem; word-break: break-word; }
        .user { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .assistant { background: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }

        /* Input Bar */
        .input-container { padding: 20px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #38bdf8; }
        button.send-btn { padding: 0 20px; background: #0284c7; border: none; color: white; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button.send-btn:hover { background: #0ea5e9; }
        button.send-btn:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- Sidebar History -->
    <div id="sidebar">
        <button id="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
        <div id="history-list"></div>
    </div>

    <!-- Main Content -->
    <div id="main-area">
        <header>
            <h2>Edge AI Playground</h2>
            <div>
                <label for="modelSelect" style="font-size: 0.85rem; color: #94a3b8; margin-right: 8px;">Model:</label>
                <select id="modelSelect">
                    <option value="@cf/qwen/qwen3-30b-a3b-fp8">Qwen 3 (30B)</option>
                    <option value="@cf/meta/llama-3.1-70b-instruct">Llama 3.1 (70B)</option>
                    <option value="@cf/mistral/mistral-7b-instruct-v0.2">Mistral 7B</option>
                </select>
            </div>
        </header>

        <div id="messages"></div>

        <div class="input-container">
            <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

<script>
    let chats = JSON.parse(localStorage.getItem('cloudflare_chats')) || [];
    let currentChatId = null;

    function initApp() {
        if (chats.length === 0) {
            startNewChat();
        } else {
            loadChat(chats[0].id);
        }
        renderHistory();
    }

    function startNewChat() {
        const newChat = {
            id: Date.now(),
            title: "New Chat",
            messages: [{ role: "assistant", content: "Hello! Select a model and ask me anything." }]
        };
        chats.unshift(newChat);
        saveAndRender();
        loadChat(newChat.id);
    }

    function loadChat(id) {
        currentChatId = id;
        renderMessages();
        renderHistory();
    }

    function saveAndRender() {
        localStorage.setItem('cloudflare_chats', JSON.stringify(chats));
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        chats.forEach(chat => {
            const div = document.createElement('div');
            div.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
            div.textContent = chat.title;
            div.onclick = () => loadChat(chat.id);
            list.appendChild(div);
        });
    }

    function renderMessages() {
        const messagesDiv = document.getElementById('messages');
        messagesDiv.innerHTML = '';
        const chat = chats.find(c => c.id === currentChatId);
        if (!chat) return;

        chat.messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = `message ${msg.role}`;
            div.textContent = msg.content;
            messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('modelSelect');
        const text = input.value.trim();
        if (!text) return;

        const chat = chats.find(c => c.id === currentChatId);
        if (!chat) return;

        // If it's the first message, update chat title
        if (chat.title === "New Chat") {
            chat.title = text.length > 25 ? text.substring(0, 25) + "..." : text;
        }

        chat.messages.push({ role: "user", content: text });
        input.value = "";
        renderMessages();

        input.disabled = true;
        sendBtn.disabled = true;

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    messages: chat.messages,
                    model: modelSelect.value
                })
            });

            const data = await res.json();
            const reply = data.response || data.result?.response || data.error || "No response received.";

            chat.messages.push({ role: "assistant", content: reply });
            saveAndRender();
            renderMessages();
        } catch (e) {
            chat.messages.push({ role: "assistant", content: "Connection error to edge server." });
            renderMessages();
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    document.getElementById('userInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });

    // Initialize on load
    initApp();
</script>

</body>
</html>
