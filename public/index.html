<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Qwen Chat</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; margin: 0; align-items: center; }
        #chat-container { width: 100%; max-width: 600px; background: #1e293b; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; height: 80vh; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        h2 { margin-top: 0; font-size: 1.25rem; border-bottom: 1px solid #334155; padding-bottom: 10px; color: #38bdf8; }
        #messages { flex: 1; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px; padding-right: 5px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 0.95rem; word-break: break-word; }
        .user { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .assistant { background: #334155; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #38bdf8; }
        button { padding: 0 20px; background: #0284c7; border: none; color: white; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        button:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="chat-container">
    <h2>Qwen Chat (Cloudflare Edge)</h2>
    <div id="messages">
        <div class="message assistant">Hello! I'm Qwen running live on Cloudflare's global edge network. How can I help you today?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let chatHistory = [{ role: "assistant", content: "Hello! I'm Qwen running live on Cloudflare's global edge network. How can I help you today?" }];

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const messagesDiv = document.getElementById("messages");
        const sendBtn = document.getElementById("sendBtn");
        const text = input.value.trim();
        if (!text) return;

        chatHistory.push({ role: "user", content: text });
        messagesDiv.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
        input.value = "";
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        input.disabled = true;
        sendBtn.disabled = true;

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: chatHistory })
            });

            const data = await res.json();
            const reply = data.response || data.result?.response || data.error || "No response received.";

            chatHistory.push({ role: "assistant", content: reply });
            messagesDiv.innerHTML += `<div class="message assistant">${escapeHtml(reply)}</div>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        } catch (e) {
            messagesDiv.innerHTML += `<div class="message assistant" style="color: #f87171;">Connection error to edge server.</div>`;
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById("userInput").addEventListener("keypress", function(e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
